# TEMPORAL (21.10.2026): prova del pol·len i dels punts de recàrrega del tauler.
name: Diagnosi temporal
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { repository: latdg/tauler, path: tauler }
      - run: pip install requests
      - name: Prova
        run: |
          mkdir -p /tmp/o
          cd tauler && python3 - > /tmp/o/sortida.txt 2>&1 <<'PY'
          import importlib.util, json, requests
          spec = importlib.util.spec_from_file_location("tv", "viu/tauler_viu.py"); tv = importlib.util.module_from_spec(spec); spec.loader.exec_module(tv)
          r = requests.get(tv.POLLEN_URL, headers=tv.CAPCALERES, timeout=60); print("pollen amb capçaleres velles:", r.status_code, r.headers.get("content-type"), r.text[:200])
          try: print("POLLEN:", tv.pollen())
          except Exception as e: print("POLLEN ERROR", repr(e))
          for m in tv.RECARREGA_MUNICIPIS:
              q = f'[out:json][timeout:90];area["ine:municipio"="{m["ine"]}"]->.a;out ids;'
              r = requests.get(tv.OVERPASS[0], params={"data": q}, headers={"User-Agent": tv.CAPCALERES["User-Agent"]}, timeout=150)
              print("àrea", m["ine"], r.status_code, r.text[:300].replace("\n", " "))
          print("OSM:", json.dumps(tv.recarrega_osm(), ensure_ascii=False)[:3000])
          PY
          cd /tmp/o && git init -q -b diagnosi && git add -A &&
            git -c user.name=diagnosi -c user.email=d@d commit -qm diagnosi &&
            git push -qf "https://x-access-token:${{ secrets.APPS_SCRIPT_TOKEN }}@github.com/latdg/apps-script.git" diagnosi
