# TEMPORAL (21.10.2026): prova de Loteries i Parlament a GitHub en mode -Prova
# (no envia ni desa res). S'esborrarà després de la prova.
name: Diagnosi temporal
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - name: Loteries i Parlament (-Prova)
        run: |
          mkdir -p /tmp/e && cp ps/inicial/*.json /tmp/e/
          export NAVEGADOR="$PWD/ps/navegador.sh" LATDG_CARPETA=/tmp/e LATDG_CONFIG=/tmp/no.json LATDG_TOKEN_PANELL=/tmp/no.txt
          mkdir -p /tmp/o
          { time pwsh -NoProfile -File ps/LoteriesLaTdG.ps1 -Prova ; } > /tmp/o/loteries.txt 2>&1
          { time pwsh -NoProfile -File ps/ParlamentLaTdG.ps1 -Prova ; } > /tmp/o/parlament.txt 2>&1
          cd /tmp/o && git init -q -b diagnosi && git add -A &&
            git -c user.name=diagnosi -c user.email=d@d commit -qm diagnosi &&
            git push -qf "https://x-access-token:${{ secrets.APPS_SCRIPT_TOKEN }}@github.com/latdg/apps-script.git" diagnosi
