# =============================================================================
# BOTS DEL PROJECTE CORREU — La TdG · 21.10.2026
# El bot d'esports NO és aquí: la FCF bloqueja les connexions des de GitHub
# (es queda a l'Apps Script, amb un planificador que només corre si hi ha partit).
# Executa el codi dels projectes d'Apps Script (del repo
# privat latdg/apps-script, tal com és) amb l'adaptador de run.js: bot de premsa,
# defuncions, resum i extres del panell, Parlaments, subhastes i dades
# municipals. Cada funció corre a les hores que tocaria amb els activadors de
# Google. L'estat es desa a la branca privada estat-bots de latdg/apps-script.
# Mentre l'Apps Script no hagi fet passarBotsAGitHub(), va en MODE PROVA i no
# envia res. Els registres detallats NO surten aquí (el repo és públic): són a
# estat-bots/registre.txt.
# SECRET: APPS_SCRIPT_TOKEN (Contents: read and write sobre latdg/apps-script)
# =============================================================================

name: Bots del projecte Correu

# 21.10.2026: l'horari de GitHub no arriba (o arriba amb hores de retard). El
# workflow fa un bucle de 5 h 30 min (bucle.sh) i es torna a llançar ell mateix.
# L'horari queda com a reserva per reprendre la cadena si s'atura.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      funcio:
        description: "Funció concreta per executar ara una vegada (buit = el bucle normal)"
        required: false
        default: ""

concurrency:
  group: bots
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4

      - name: Codi dels projectes (repo privat)
        uses: actions/checkout@v4
        with:
          repository: latdg/apps-script
          token: ${{ secrets.APPS_SCRIPT_TOKEN }}
          path: codi
          sparse-checkout: |
            Correu
            alertes

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependències
        run: npm install --no-audit --no-fund --silent

      - name: Estat
        run: |
          URL="https://x-access-token:${TOKEN}@github.com/latdg/apps-script.git"
          git clone -q --depth 1 --branch estat-bots "$URL" estat 2>/dev/null || mkdir -p estat

      - name: Executar
        env:
          FUNCIO: ${{ inputs.funcio }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$FUNCIO" ]; then ./bucle.sh una "$FUNCIO"; else ./bucle.sh; fi

      - name: Tornar-se a llançar
        if: always() && inputs.funcio == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bots.yml -R "${{ github.repository }}"
