name: Diagnosi L'Aguait (temporal)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://api.ipify.org; echo
          for u in https://laguait.cat/feed/ https://laguait.cat/ https://www.laguait.cat/feed/ "https://laguait.cat/wp-json/wp/v2/posts?per_page=3&_fields=link"; do
            echo "=== $u"
            curl -sS -m 40 -A "Mozilla/5.0" -D - -o /tmp/b "$u" | head -25 || echo "curl error $?"
            head -c 400 /tmp/b 2>/dev/null; echo
          done
          getent hosts laguait.cat
