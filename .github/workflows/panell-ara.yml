# TEMPORAL (21.10.2026): regenera ara el resum del panell (sense tocar l'estat
# del bucle) perquè GitHub Pages publiqui la versió nova. S'esborrarà després.
name: Panell ara (temporal)
on: workflow_dispatch
jobs:
  panell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: latdg/apps-script
          token: ${{ secrets.APPS_SCRIPT_TOKEN }}
          path: codi
          sparse-checkout: Correu
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund --silent
      - name: Resum del panell
        run: |
          git clone -q --depth 1 --branch estat-bots "https://x-access-token:${{ secrets.APPS_SCRIPT_TOKEN }}@github.com/latdg/apps-script.git" estat
          rm -rf estat/.git
          node run.js --codi codi/Correu --estat estat --funcio actualitzarResumPanell > /dev/null 2>&1 && echo fet || echo error
