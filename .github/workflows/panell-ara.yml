# TEMPORAL (21.10.2026): primera càrrega de la contractació de l'any al panell.
name: Panell ara (temporal)
on: workflow_dispatch
jobs:
  panell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: latdg/apps-script
          token: ${{ secrets.APPS_SCRIPT_TOKEN }}
          path: codi
          sparse-checkout: Correu
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund --silent
      - name: Contractació de l'any
        run: |
          git clone -q --depth 1 --branch estat-bots "https://x-access-token:${{ secrets.APPS_SCRIPT_TOKEN }}@github.com/latdg/apps-script.git" estat
          rm -rf estat/.git
          node run.js --codi codi/Correu --estat estat --funcio actualitzarContractacioAnyPanell 2>&1 | grep -E "✅|❌|Peticions" || true
          grep -E "Contractació de l'any" estat/registre.txt | tail -12 || true
