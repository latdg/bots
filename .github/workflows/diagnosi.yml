# Diagnòstic puntual de connexió (temporal)
name: Diagnosi
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="https://www.fcf.cat/api/competition/partidos?temporadaId=21&disciplinaId=1&competicioId=1&grupId=1"
          {
          echo "IP: $(curl -s https://api.ipify.org)"
          for ua in "Mozilla/5.0" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"; do
            echo "UA=$ua -> $(curl -s -o /tmp/b -w '%{http_code}' -A "$ua" -H 'Accept: application/json, text/plain, */*' -H 'Accept-Language: ca,es;q=0.9' -H 'Referer: https://www.fcf.cat/' "$U") $(head -c 200 /tmp/b | tr '\n' ' ')"
          done
          echo "web: $(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' https://www.fcf.cat/)"
          curl -s -D - -o /dev/null -A 'Mozilla/5.0' "$U" | head -20
          } > diag.txt 2>&1
          URL="https://x-access-token:${{ secrets.APPS_SCRIPT_TOKEN }}@github.com/latdg/apps-script.git"
          git clone -q --depth 1 --branch estat-bots "$URL" e && cp diag.txt e/diagnosi.txt && cd e && git -c user.name=d -c user.email=d@d add diagnosi.txt && git -c user.name=d -c user.email=d@d commit -qm diag && git push -q "$URL" HEAD:estat-bots
